<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Havana Cigar Club - Exclusive Rewards</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --dark-wood: #0d0b09;
            --card-bg: #1a1612;
            --accent: #2c2219;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #1c1510 0%, #080605 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Ambient subtle light overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            z-index: 2;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--gold-light);
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.85;
        }

        .game-title {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            margin-top: 15px;
            color: #fff;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(2, 160px);
            gap: 20px;
            perspective: 1000px;
            z-index: 2;
        }

        @media (min-width: 650px) {
            .cards-container {
                grid-template-columns: repeat(4, 160px);
            }
        }

        .card {
            width: 160px;
            height: 240px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-align: center;
            border: 2px solid var(--gold);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        }

        /* Card Front Styling */
        .card-front {
            background: linear-gradient(145deg, #241c15, #120e0a);
        }

        .card-front::after {
            content: '';
            position: absolute;
            inset: 8px;
            border: 1px dashed var(--gold);
            border-radius: 8px;
            opacity: 0.5;
        }

        .card-brand {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--gold);
            letter-spacing: 2px;
        }

        .card-tap-text {
            font-size: 0.75rem;
            color: var(--gold-light);
            margin-top: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Card Back Styling */
        .card-back {
            background: linear-gradient(145deg, #1f1912, #2d2319);
            transform: rotateY(180deg);
            border-color: #fff;
        }

        .prize-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .prize-icon {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        /* Modal / Notification Area */
        .result-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
        }

        .result-modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #221a14, #0d0a07);
            border: 2px solid var(--gold);
            border-radius: 16px;
            padding: 30px 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 1.6rem;
            margin-bottom: 10px;
        }

        .modal-prize {
            font-size: 1.1rem;
            color: #fff;
            margin: 15px 0;
            font-weight: 600;
        }

        .code-box {
            background: #000;
            border: 1px dashed var(--gold);
            color: var(--gold);
            font-family: monospace;
            font-size: 1.4rem;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            letter-spacing: 2px;
        }

        .cta-button {
            display: inline-block;
            width: 100%;
            background: linear-gradient(45deg, #d4af37, #aa820a);
            color: #000;
            font-weight: 700;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }

        .timer-box {
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--gold-light);
            text-align: center;
            z-index: 2;
            display: none;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">HCC</div>
        <div class="subtitle">Havana Cigar Club</div>
        <div class="game-title">Select Your Royal VIP Card</div>
    </header>

    <div class="cards-container" id="cardsContainer">
        <!-- Cards generated dynamically via JavaScript -->
    </div>

    <div class="timer-box" id="timerBox">
        Next Daily Draw available in: <span id="countdown">24:00:00</span>
    </div>

    <!-- Modal Result Window -->
    <div class="result-modal" id="resultModal">
        <div class="modal-content">
            <div class="modal-title">Congratulations</div>
            <div style="font-size: 0.85rem; color: #ccc;">You have unlocked an exclusive reward:</div>
            
            <div class="modal-prize" id="modalPrizeText"></div>
            
            <div style="font-size: 0.75rem; color: var(--gold-light);">YOUR UNIQUE OFFER CODE:</div>
            <div class="code-box" id="modalCodeBox">HCC-0000</div>
            
            <a href="#" class="cta-button" id="whatsappBtn" target="_blank">
                Claim Reward via WhatsApp
            </a>
        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = "963983025324"; // Format for WhatsApp deep link

        const prizesMaster = [
            { id: 1, title: "VIP Discount on your first 3 boxes", icon: "👑" },
            { id: 2, title: "Lifetime Free VIP Express Delivery", icon: "✈️" },
            { id: 3, title: "Bonus Pick: Choose another card right now!", icon: "🔄", isBonus: true },
            { id: 4, title: "10% Discount + Free Cigar Cutter Gift", icon: "✂️" }
        ];

        let currentPrizes = [];
        let canPlay = true;

        // Shuffle Array Function
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            let newArr = [...array];
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [newArr[currentIndex], newArr[randomIndex]] = [newArr[randomIndex], newArr[currentIndex]];
            }
            return newArr;
        }

        // Generate Random Code
        function generateCode() {
            return 'HCC-' + Math.floor(1000 + Math.random() * 9000);
        }

        // Initialize Game
        function initGame() {
            const lastPlayed = localStorage.getItem('hcc_last_played');
            const now = new Date().getTime();
            const cooldownTime = 24 * 60 * 60 * 1000; // 24 Hours

            if (lastPlayed && (now - lastPlayed < cooldownTime)) {
                canPlay = false;
                startTimer(cooldownTime - (now - lastPlayed));
            }

            currentPrizes = shuffle(prizesMaster);
            renderCards();
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            currentPrizes.forEach((prize, index) => {
                const card = document.createElement('div');
                card.className = `card ${!canPlay ? 'disabled' : ''}`;
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="card-face card-front">
                        <div class="card-brand">HCC</div>
                        <div class="card-tap-text">TAP TO REVEAL</div>
                    </div>
                    <div class="card-face card-back">
                        <div class="prize-icon">${prize.icon}</div>
                        <div class="prize-title">${prize.title}</div>
                    </div>
                `;

                card.addEventListener('click', () => handleCardClick(card, prize));
                container.appendChild(card);
            });
        }

        function handleCardClick(cardElement, prize) {
            if (!canPlay || cardElement.classList.contains('flipped')) return;

            cardElement.classList.add('flipped');

            // Handle Bonus Pick Card (Card 3)
            if (prize.isBonus) {
                setTimeout(() => {
                    alert("✨ Bonus Pick Activated! Cards are reshuffled. Choose another card now!");
                    currentPrizes = shuffle(prizesMaster);
                    renderCards();
                }, 900);
                return;
            }

            // Normal Card Win Scenario
            canPlay = false;
            const now = new Date().getTime();
            localStorage.setItem('hcc_last_played', now);

            const uniqueCode = generateCode();
            
            setTimeout(() => {
                showModal(prize.title, uniqueCode);
                startTimer(24 * 60 * 60 * 1000);
            }, 1000);
        }

        function showModal(prizeTitle, code) {
            document.getElementById('modalPrizeText').innerText = prizeTitle;
            document.getElementById('modalCodeBox').innerText = code;

            const textMessage = `Hello Havana Cigar Club, I played the VIP card game on your website and won: *${prizeTitle}*. My claim code is: *${code}*. I would like to place an order.`;
            const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(textMessage)}`;
            
            document.getElementById('whatsappBtn').href = waUrl;
            document.getElementById('resultModal').classList.add('active');
        }

        function startTimer(duration) {
            const timerBox = document.getElementById('timerBox');
            const countdownEl = document.getElementById('countdown');
            timerBox.style.display = 'block';

            let timer = Math.floor(duration / 1000);

            const interval = setInterval(() => {
                let hours = Math.floor(timer / 3600);
                let minutes = Math.floor((timer % 3600) / 60);
                let seconds = Math.floor(timer % 60);

                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                countdownEl.innerText = `${hours}:${minutes}:${seconds}`;

                if (--timer < 0) {
                    clearInterval(interval);
                    localStorage.removeItem('hcc_last_played');
                    canPlay = true;
                    timerBox.style.display = 'none';
                    initGame();
                }
            }, 1000);
        }

        // Start Script
        initGame();
    </script>
</body>
</html>
